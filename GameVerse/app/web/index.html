<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script>
    // El volumen nativo de un <audio> web se limita a 100 %. Este puente crea
    // una cadena Web Audio por cada elemento remoto para permitir 0-200 %.
    window.__nubzzzSetRemoteAudioGain = (audio, gain) => {
      if (!audio) return;
      const targetGain = Math.max(0, Math.min(2, Number(gain) || 0));
      try {
        if (!audio.__nubzzzGainNode) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) {
            audio.volume = Math.min(1, targetGain);
            return;
          }
          const context = window.__nubzzzAudioContext ||= new AudioContextClass();
          const source = context.createMediaElementSource(audio);
          const gainNode = context.createGain();
          source.connect(gainNode);
          gainNode.connect(context.destination);
          audio.__nubzzzGainNode = gainNode;
        }
        const context = audio.__nubzzzGainNode.context;
        if (context.state === 'suspended') context.resume();
        audio.volume = 1;
        audio.__nubzzzGainNode.gain.setTargetAtTime(
          targetGain,
          context.currentTime,
          0.015,
        );
      } catch (error) {
        // Fallback para navegadores que no permitan conectar el elemento.
        audio.volume = Math.min(1, targetGain);
      }
    };

    window.nubzzzSpotify = {
      player: null,
      deviceId: null,
      init: function (getToken, onReady, onState, onError) {
        const createPlayer = () => {
          if (!window.Spotify || this.player) return;
          this.player = new Spotify.Player({
            name: 'nubzzz Web Player',
            getOAuthToken: callback => callback(getToken()),
            volume: 0.75,
            enableMediaSession: true,
          });
          this.player.addListener('ready', ({ device_id }) => {
            this.deviceId = device_id;
            onReady(device_id);
          });
          this.player.addListener('player_state_changed', state => onState(JSON.stringify(state)));
          // El evento no siempre llega tras una transferencia de dispositivo;
          // consultar el estado local mantiene título y carátula sincronizados.
          setInterval(() => {
            this.player.getCurrentState().then(state => {
              if (state) onState(JSON.stringify(state));
            });
          }, 1500);
          ['initialization_error', 'authentication_error', 'account_error'].forEach(event =>
            this.player.addListener(event, ({ message }) => onError(message))
          );
          this.player.connect();
        };
        if (window.Spotify) createPlayer();
        else window.onSpotifyWebPlaybackSDKReady = createPlayer;
      },
    };
  </script>
</body>
</html>
